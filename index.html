<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>日程調整</title>
  <script>
    const _t = localStorage.getItem('theme_pref');
    if (_t && _t !== 'system') document.documentElement.setAttribute('data-theme', _t);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@600;700&display=swap">
  <style>
    /* ── TOKENS ── */
    :root {
      --bg: #F2F0EC;
      --surface: #FFFFFF;
      --surface-2: #F8F7F4;
      --border: #E0DCD4;
      --border-strong: #C4BEB4;
      --text: #1A1815;
      --text-muted: #88837A;
      --accent: #0D7356;
      --accent-h: #0A5C44;
      --accent-fg: #FFFFFF;
      --accent-lt: #E3F4EE;
      --s0: #C2BDB6;
      --s1-bg: #E6F4ED; --s1: #16A05E; --s1-h: #D0EBE0;
      --s2-bg: #FFF4DC; --s2: #B87000; --s2-h: #FAEDC8;
      --s3-bg: #FDECEA; --s3: #CC3B3B; --s3-h: #F9D9D7;
      --sticky-sh: 4px 0 10px -2px rgba(0,0,0,0.08);
      --card-sh: 0 2px 8px rgba(0,0,0,0.06);
      --sheet-sh: 0 -4px 32px rgba(0,0,0,0.14);
      --r: 12px; --r-sm: 8px;
      --hh: 52px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #111310; --surface: #1B1D1A; --surface-2: #151714;
        --border: #2A2D28; --border-strong: #3A3D38;
        --text: #EAE7E1; --text-muted: #7A7870;
        --accent: #28A67A; --accent-h: #33BF8D; --accent-fg: #071A12; --accent-lt: #0C2218;
        --s0: #4A4740;
        --s1-bg: #0C2118; --s1: #3AB872; --s1-h: #112A1E;
        --s2-bg: #211808; --s2: #D09020; --s2-h: #2C2010;
        --s3-bg: #201010; --s3: #E05858; --s3-h: #2C1414;
        --sticky-sh: 4px 0 14px rgba(0,0,0,0.45);
        --card-sh: 0 2px 8px rgba(0,0,0,0.25);
        --sheet-sh: 0 -4px 32px rgba(0,0,0,0.5);
      }
    }
    :root[data-theme="dark"] {
      --bg: #111310; --surface: #1B1D1A; --surface-2: #151714;
      --border: #2A2D28; --border-strong: #3A3D38;
      --text: #EAE7E1; --text-muted: #7A7870;
      --accent: #28A67A; --accent-h: #33BF8D; --accent-fg: #071A12; --accent-lt: #0C2218;
      --s0: #4A4740;
      --s1-bg: #0C2118; --s1: #3AB872; --s1-h: #112A1E;
      --s2-bg: #211808; --s2: #D09020; --s2-h: #2C2010;
      --s3-bg: #201010; --s3: #E05858; --s3-h: #2C1414;
      --sticky-sh: 4px 0 14px rgba(0,0,0,0.45);
      --card-sh: 0 2px 8px rgba(0,0,0,0.25);
      --sheet-sh: 0 -4px 32px rgba(0,0,0,0.5);
    }

    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif;
      font-size: 14px; line-height: 1.6;
      background: var(--bg); color: var(--text);
      min-height: 100%; min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
    }
    button { font-family: inherit; cursor: pointer; background: none; border: none; color: inherit; }
    input { font-family: inherit; }
    a { text-decoration: none; }

    /* ── VIEW SYSTEM ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── HEADER (shared) ── */
    .header {
      display: flex; align-items: center; gap: 8px;
      padding: 0 14px; height: var(--hh);
      background: var(--surface); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 30;
    }
    .wordmark {
      font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 700;
      color: var(--accent); letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 7px; flex-shrink: 0;
    }
    .wdot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .hbtn {
      padding: 7px 10px; border-radius: var(--r-sm); font-size: 13px; font-weight: 500;
      color: var(--text-muted); border: 1px solid var(--border);
      transition: background .15s, color .15s;
    }
    .hbtn:hover { background: var(--surface-2); color: var(--text); }
    .hbtn.accent { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    .hbtn.accent:hover { background: var(--accent-h); }
    .hbtn-icon { padding: 7px 9px; font-size: 16px; }
    .spacer { flex: 1; }

    /* ── HOME VIEW ── */
    .home-main {
      max-width: 640px; margin: 0 auto;
      padding: 24px 16px 120px;
    }
    .home-section-title {
      font-size: 11px; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px;
    }
    .schedule-list { display: flex; flex-direction: column; gap: 10px; }

    .sched-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px 14px 14px 16px;
      cursor: pointer; transition: border-color .15s, box-shadow .15s;
    }
    .sched-card:hover { border-color: var(--accent); box-shadow: var(--card-sh); }
    .sched-card:active { opacity: .85; }
    .scard-body { flex: 1; min-width: 0; }
    .scard-title {
      font-size: 15px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .scard-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .scard-arrow { color: var(--text-muted); font-size: 18px; flex-shrink: 0; }
    .scard-del {
      padding: 8px; border-radius: var(--r-sm); color: var(--text-muted);
      transition: background .15s, color .15s; flex-shrink: 0; font-size: 14px;
    }
    .scard-del:hover { background: var(--s3-bg); color: var(--s3); }

    .empty-home {
      text-align: center; padding: 48px 16px; color: var(--text-muted);
    }
    .empty-home-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-home strong { display: block; font-size: 16px; color: var(--text); margin-bottom: 8px; }
    .empty-home p { font-size: 14px; }

    /* ── MEMBER MASTER ── */
    .master-section { margin-top: 32px; }
    .master-header {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none; margin-bottom: 12px;
    }
    .master-header:hover .home-section-title { color: var(--accent); }
    .master-chevron {
      font-size: 12px; color: var(--text-muted); transition: transform .2s;
    }
    .master-section.open .master-chevron { transform: rotate(180deg); }
    .master-body { display: none; }
    .master-section.open .master-body { display: block; }
    .master-list {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden; margin-bottom: 10px;
    }
    .master-row {
      display: flex; align-items: center; gap: 6px;
      padding: 9px 10px 9px 14px;
      border-bottom: 1px solid var(--border);
    }
    .master-row:last-child { border-bottom: none; }
    .master-name {
      flex: 1; font-size: 14px; font-weight: 500; cursor: text;
    }
    .master-name:hover { color: var(--accent); }
    .master-row-btns { display: flex; gap: 1px; }
    .mrbtn {
      width: 26px; height: 26px; border-radius: 5px; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: background .15s, color .15s;
    }
    .mrbtn:hover { background: var(--surface-2); color: var(--text); }
    .mrbtn.del:hover { background: var(--s3-bg); color: var(--s3); }
    .master-add-row {
      display: flex; gap: 8px; align-items: center;
    }
    .master-add-input {
      flex: 1; height: 38px; padding: 0 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-sm); font-size: 14px; color: var(--text);
    }
    .master-add-input:focus { border-color: var(--accent); outline: none; }
    .master-add-btn {
      height: 38px; padding: 0 16px;
      background: var(--accent); color: var(--accent-fg);
      border-radius: var(--r-sm); font-size: 14px; font-weight: 600;
      white-space: nowrap; transition: opacity .15s;
    }
    .master-add-btn:hover { opacity: .88; }

    /* FAB */
    .fab-wrap {
      position: fixed; bottom: max(24px, env(safe-area-inset-bottom, 24px));
      left: 50%; transform: translateX(-50%); z-index: 20;
    }
    .fab {
      display: flex; align-items: center; gap: 8px;
      background: var(--accent); color: var(--accent-fg);
      border-radius: 100px; padding: 14px 24px;
      font-size: 15px; font-weight: 700;
      box-shadow: 0 4px 20px rgba(13,115,86,.38);
      transition: background .15s, transform .12s, box-shadow .15s;
      white-space: nowrap;
    }
    .fab:hover { background: var(--accent-h); box-shadow: 0 6px 24px rgba(13,115,86,.45); }
    .fab:active { transform: scale(.97); }

    /* ── SCHEDULE VIEW ── */
    .back-btn {
      display: flex; align-items: center; gap: 4px;
      font-size: 14px; font-weight: 600; color: var(--accent);
      padding: 6px 2px; flex-shrink: 0;
    }
    .back-btn:hover { opacity: .75; }
    .sched-title-input {
      flex: 1; min-width: 0;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px; font-weight: 700; color: var(--text);
      background: transparent; border: none; outline: none;
      padding: 4px 6px; border-radius: var(--r-sm);
      transition: background .15s;
    }
    .sched-title-input:focus { background: var(--surface-2); }
    .sched-title-input::placeholder { color: var(--text-muted); font-weight: 400; }

    /* Shared banner */
    .shared-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 16px; background: var(--accent-lt); border-bottom: 1px solid var(--accent);
      font-size: 13px; color: var(--accent);
    }
    .shared-banner.hidden { display: none; }
    .shared-banner strong { font-weight: 600; }
    .save-btn {
      background: var(--accent); color: var(--accent-fg);
      border-radius: 100px; padding: 6px 14px; font-size: 13px; font-weight: 600;
      white-space: nowrap; flex-shrink: 0;
    }

    .schedule-main {
      max-width: 100%; padding: 16px 14px 120px;
    }

    /* ── TABLE ── */
    .table-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden;
    }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .matrix { border-collapse: collapse; min-width: max-content; }

    .th-name {
      position: sticky; left: 0; z-index: 5;
      background: var(--surface-2); min-width: 120px;
      padding: 10px 12px;
      text-align: left; font-size: 10px; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted);
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      box-shadow: var(--sticky-sh);
    }
    .th-event {
      min-width: 100px; padding: 0;
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .th-addcol { width: 48px; border-bottom: 1px solid var(--border); background: var(--surface); }

    .event-header {
      padding: 9px 10px 7px;
      display: flex; align-items: flex-start; justify-content: space-between; gap: 4px;
      min-height: 56px;
    }
    .event-name {
      font-size: 12px; font-weight: 600; color: var(--text);
      line-height: 1.35; word-break: break-word; flex: 1; cursor: text;
    }
    .event-name:hover { color: var(--accent); }
    .ev-del {
      flex-shrink: 0; width: 18px; height: 18px; border-radius: 4px;
      font-size: 11px; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s, background .15s, color .15s;
      color: var(--text-muted); padding: 0;
    }
    .th-event:hover .ev-del { opacity: 1; }
    .ev-del:hover { background: var(--s3-bg); color: var(--s3); }

    /* Past / upcoming column styling */
    .th-event.past { opacity: 0.42; }
    .th-event.past .event-name { color: var(--text-muted); }
    .td-cell.past { opacity: 0.5; }
    .th-event.next-upcoming {
      border-top: 2.5px solid var(--accent);
    }
    .upcoming-badge {
      display: inline-block; font-size: 9px; font-weight: 700;
      background: var(--accent); color: #fff; border-radius: 3px;
      padding: 1px 4px; margin-bottom: 3px; letter-spacing: 0.04em;
    }

    .btn-addcol {
      width: 100%; min-height: 56px; color: var(--text-muted); font-size: 22px;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .btn-addcol:hover { background: var(--accent-lt); color: var(--accent); }

    /* Member row */
    .td-name {
      position: sticky; left: 0; z-index: 3;
      background: var(--surface); padding: 0 6px 0 12px;
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      box-shadow: var(--sticky-sh);
    }
    .name-cell {
      display: flex; align-items: center; gap: 2px;
      min-height: 56px; padding: 6px 0;
    }
    .member-name {
      font-size: 14px; font-weight: 500; flex: 1;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: text;
    }
    .member-name:hover { color: var(--accent); }
    .row-acts {
      display: flex; gap: 1px; flex-shrink: 0;
      opacity: 0; transition: opacity .15s;
    }
    tr:hover .row-acts { opacity: 1; }
    /* Always show on touch devices */
    @media (hover: none) { .row-acts { opacity: .55; } }
    .rbtn {
      width: 24px; height: 24px; border-radius: 5px; font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: background .15s, color .15s;
    }
    .rbtn:hover { background: var(--border); color: var(--text); }
    .rbtn.del:hover { background: var(--s3-bg); color: var(--s3); }

    /* Status cells */
    .td-cell {
      border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
      text-align: center; cursor: pointer; transition: background .1s;
    }
    .td-cell:last-child { border-right: none; }
    .ci { display: flex; align-items: center; justify-content: center; height: 56px; }
    .si { font-size: 22px; font-weight: 700; line-height: 1; user-select: none; }
    .td-cell.s0 { background: var(--surface); }
    .td-cell.s0:hover { background: var(--surface-2); }
    .td-cell.s0 .si { color: var(--s0); }
    .td-cell.s1 { background: var(--s1-bg); }
    .td-cell.s1:hover { background: var(--s1-h); }
    .td-cell.s1 .si { color: var(--s1); }
    .td-cell.s2 { background: var(--s2-bg); }
    .td-cell.s2:hover { background: var(--s2-h); }
    .td-cell.s2 .si { color: var(--s2); }
    .td-cell.s3 { background: var(--s3-bg); }
    .td-cell.s3:hover { background: var(--s3-h); }
    .td-cell.s3 .si { color: var(--s3); }
    .td-spacer { border-right: none; border-bottom: 1px solid var(--border); width: 48px; }

    /* Summary row */
    .sum-row td { background: var(--surface-2); border-top: 2px solid var(--border-strong); }
    .sum-row .td-cell { cursor: default; }
    .sum-row .td-cell:hover { background: var(--surface-2) !important; }
    .sum-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); padding: 0 12px; }
    .sum-counts { display: flex; align-items: center; justify-content: center; gap: 3px; flex-wrap: wrap; padding: 8px 4px; }
    .chip { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 100px; }
    .chip.c { background: var(--s1-bg); color: var(--s1); }
    .chip.t { background: var(--s2-bg); color: var(--s2); }
    .chip.x { background: var(--s3-bg); color: var(--s3); }

    /* ── ADD CONTROLS ── */
    .add-controls { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .add-group { display: flex; gap: 6px; }
    .add-input {
      font-size: 14px; color: var(--text); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r-sm);
      padding: 9px 12px; outline: none; width: 170px;
      transition: border-color .2s, box-shadow .2s;
    }
    .add-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-lt); }
    .add-input::placeholder { color: var(--text-muted); }
    .btn-add {
      background: var(--accent); color: var(--accent-fg);
      border-radius: var(--r-sm); padding: 9px 14px; font-size: 13px; font-weight: 600;
      transition: background .15s; white-space: nowrap;
    }
    .btn-add:hover { background: var(--accent-h); }

    /* ── LEGEND ── */
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-muted); }
    .ls { font-size: 14px; font-weight: 700; }
    .ls.s0 { color: var(--s0); } .ls.s1 { color: var(--s1); }
    .ls.s2 { color: var(--s2); } .ls.s3 { color: var(--s3); }

    /* ── INLINE EDIT INPUTS ── */
    .ied-ev {
      font-size: 12px; font-weight: 600; width: 100%;
      background: var(--accent-lt); border: 1.5px solid var(--accent);
      border-radius: 5px; padding: 2px 6px; outline: none;
      font-family: 'Noto Sans JP', sans-serif; color: var(--text);
    }
    .ied-name {
      font-size: 14px; font-weight: 500; width: 100px;
      background: var(--accent-lt); border: 1.5px solid var(--accent);
      border-radius: 5px; padding: 2px 6px; outline: none;
      font-family: 'Noto Sans JP', sans-serif; color: var(--text);
    }

    /* ── BOTTOM BAR ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 25;
      display: flex; align-items: center; justify-content: space-around;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 8px 12px max(12px, env(safe-area-inset-bottom, 12px));
      gap: 6px;
    }
    .bar-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 10px; border-radius: var(--r-sm);
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      transition: background .15s, color .15s; flex: 1;
    }
    .bar-btn:hover { background: var(--surface-2); color: var(--text); }
    .bar-btn:active { background: var(--border); }
    .bar-btn svg { flex-shrink: 0; }
    .bar-btn.share {
      background: var(--accent); color: var(--accent-fg);
      border-radius: var(--r); flex: 1.4; padding: 8px 12px;
    }
    .bar-btn.share:hover { background: var(--accent-h); }

    /* ── SHARE SHEET ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0);
      z-index: 40; pointer-events: none;
      transition: background .25s;
    }
    .overlay.open { background: rgba(0,0,0,.42); pointer-events: all; }

    .sheet {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      background: var(--surface); border-radius: 20px 20px 0 0;
      box-shadow: var(--sheet-sh);
      transform: translateY(100%); transition: transform .3s cubic-bezier(.16,1,.3,1);
      padding-bottom: max(20px, env(safe-area-inset-bottom, 20px));
      max-height: 85dvh; overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }

    .sheet-handle {
      width: 36px; height: 4px; background: var(--border-strong);
      border-radius: 2px; margin: 12px auto 8px;
    }
    .sheet-inner { padding: 4px 16px 8px; }
    .sheet-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
    .sheet-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%; padding: 14px 16px; border-radius: var(--r); margin-bottom: 8px;
      font-size: 15px; font-weight: 600; text-align: left; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); transition: background .15s, border-color .15s;
    }
    .sheet-btn:hover { border-color: var(--accent); background: var(--accent-lt); }
    .sheet-btn:active { opacity: .8; }
    .sheet-sep { height: 1px; background: var(--border); margin: 8px 0 14px; }
    .sheet-sub { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }

    /* LINE button */
    .line-btn {
      background: #00B900 !important; border-color: #00B900 !important; color: #fff !important;
    }
    .line-btn:hover { background: #009B00 !important; border-color: #009B00 !important; }

    .sheet-close-btn {
      width: 100%; padding: 13px; text-align: center;
      font-size: 15px; font-weight: 600; color: var(--text-muted);
      border-radius: var(--r); transition: background .15s;
    }
    .sheet-close-btn:hover { background: var(--surface-2); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: max(90px, calc(env(safe-area-inset-bottom, 0px) + 90px));
      left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--text); color: var(--surface);
      font-size: 13px; font-weight: 600; padding: 10px 20px;
      border-radius: 100px; opacity: 0; pointer-events: none; z-index: 9999;
      transition: opacity .2s, transform .2s; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── EMPTY (matrix) ── */
    .mx-empty { padding: 48px 24px; text-align: center; color: var(--text-muted); }
    .mx-empty strong { display: block; color: var(--text); margin-bottom: 6px; }

    /* ── FOCUS ── */
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .add-input { width: 140px; }
      .th-name { min-width: 100px; }
      .add-controls { gap: 8px; }
    }
  </style>
</head>

<div id="toast" class="toast"></div>

<script>
/* ================================================================
   CONSTANTS & HELPERS
================================================================ */
const STATUS  = ['—', '○', '△', '×'];
const STATUS_NEXT = [1, 2, 3, 0];
const LS_KEY  = 'schedule_list_v2';
const LS_MEMBERS = 'member_master_v1';
const DEFAULT_MEMBERS = ['ハギ','おぐら','一也','シュウヘイ','ニシオ','トモユキ','大塚'];

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}

/* ================================================================
   STATE
================================================================ */
let scheduleList = [];
let current     = null;
let isShared    = false;
let memberMaster = [];

function saveList() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(scheduleList)); } catch(e) {}
}

function loadList() {
  try {
    const s = localStorage.getItem(LS_KEY);
    if (s) { const d = JSON.parse(s); if (Array.isArray(d)) { scheduleList = d; return; } }
  } catch(e) {}
  scheduleList = [];
}

function saveMasterMembers() {
  try { localStorage.setItem(LS_MEMBERS, JSON.stringify(memberMaster)); } catch(e) {}
}

function loadMasterMembers() {
  try {
    const s = localStorage.getItem(LS_MEMBERS);
    if (s) { const d = JSON.parse(s); if (Array.isArray(d)) { memberMaster = d; return; } }
  } catch(e) {}
  memberMaster = DEFAULT_MEMBERS.map(name => ({ id: uid(), name }));
  saveMasterMembers();
}

function saveCurrentToList() {
  if (!current || isShared) return;
  current.updatedAt = new Date().toISOString();
  const idx = scheduleList.findIndex(s => s.id === current.id);
  if (idx >= 0) scheduleList[idx] = current;
  else scheduleList.unshift(current);
  saveList();
}

/* ================================================================
   ROUTING
================================================================ */
function route() {
  const hash = location.hash;

  if (hash.startsWith('#data=')) {
    try {
      const data = JSON.parse(decodeURIComponent(atob(hash.slice(6))));
      if (data && Array.isArray(data.members)) {
        current  = { ...data, id: data.id || uid() };
        if (!current.cells) current.cells = {};
        isShared = true;
        showView('schedule');
        return;
      }
    } catch(e) {}
  }

  if (hash.startsWith('#id=')) {
    const id = hash.slice(4);
    const s  = scheduleList.find(s => s.id === id);
    if (s) { current = s; isShared = false; showView('schedule'); return; }
  }

  if (hash === '#new') { createNew(); return; }
  showView('home');
}

window.addEventListener('popstate', route);

function navigate(hash) {
  history.pushState(null, '', location.pathname + hash);
  route();
}

/* ================================================================
   VIEWS
================================================================ */
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  if (name === 'home')     renderHome();
  if (name === 'schedule') renderSchedule();
}

/* ── HOME ── */
function renderHome() {
  const list = document.getElementById('schedule-list');
  updateThemeBtns();

  if (scheduleList.length === 0) {
    list.innerHTML = `<div class="empty-home">
      <div class="empty-home-icon">📋</div>
      <strong>スケジュールがまだありません</strong>
      <p>下の＋ボタンから作成してください</p>
    </div>`;
  } else {
    list.innerHTML = scheduleList.map(s => `
      <div class="sched-card" onclick="openSchedule('${s.id}')">
        <div class="scard-body">
          <div class="scard-title">${esc(s.title || '無題のスケジュール')}</div>
          <div class="scard-meta">
            ${s.members?.length ?? 0}名 · ${s.events?.length ?? 0}件
            ${s.updatedAt ? ' · ' + fmtDate(s.updatedAt) + '更新' : ''}
          </div>
        </div>
        <button class="scard-del" onclick="deleteSchedule(event,'${s.id}')" title="削除">✕</button>
        <span class="scard-arrow">›</span>
      </div>
    `).join('');
  }
  renderMasterMembers();
}

/* ── MASTER MEMBERS ── */
function toggleMasterSection() {
  document.getElementById('master-section').classList.toggle('open');
}

function renderMasterMembers() {
  const el = document.getElementById('master-list');
  if (!el) return;
  if (memberMaster.length === 0) {
    el.innerHTML = `<div style="padding:14px;font-size:13px;color:var(--text-muted);text-align:center">まだメンバーがいません</div>`;
    return;
  }
  el.innerHTML = memberMaster.map((m, i) => `
    <div class="master-row">
      <span class="master-name" ondblclick="editMasterMemberName('${m.id}',this)"
            title="ダブルタップで編集">${esc(m.name)}</span>
      <div class="master-row-btns">
        <button class="mrbtn" onclick="moveMasterMember('${m.id}',-1)" title="上へ"
          ${i===0?'style="visibility:hidden"':''}>↑</button>
        <button class="mrbtn" onclick="moveMasterMember('${m.id}',1)" title="下へ"
          ${i===memberMaster.length-1?'style="visibility:hidden"':''}>↓</button>
        <button class="mrbtn del" onclick="deleteMasterMember('${m.id}')" title="削除">✕</button>
      </div>
    </div>
  `).join('');
}

function addMasterMember() {
  const el = document.getElementById('master-add-input');
  const name = el.value.trim();
  if (!name) { el.focus(); return; }
  memberMaster.push({ id: uid(), name });
  saveMasterMembers();
  renderMasterMembers();
  el.value = ''; el.focus();
}

function deleteMasterMember(id) {
  memberMaster = memberMaster.filter(m => m.id !== id);
  saveMasterMembers();
  renderMasterMembers();
}

function moveMasterMember(id, dir) {
  const i = memberMaster.findIndex(m => m.id === id);
  const j = i + dir;
  if (j < 0 || j >= memberMaster.length) return;
  [memberMaster[i], memberMaster[j]] = [memberMaster[j], memberMaster[i]];
  saveMasterMembers();
  renderMasterMembers();
}

function editMasterMemberName(id, el) {
  const m = memberMaster.find(m => m.id === id);
  if (!m) return;
  const inp = document.createElement('input');
  inp.style.cssText = 'flex:1;border:none;background:transparent;font:inherit;outline:none;color:inherit';
  inp.value = m.name;
  el.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const save = () => {
    if (done) return; done = true;
    const v = inp.value.trim(); if (v) m.name = v;
    saveMasterMembers();
    renderMasterMembers();
  };
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { done = true; renderMasterMembers(); }
  });
}

function goHome() {
  closeShareSheet();
  navigate('#');
}

function openSchedule(id) {
  navigate('#id=' + id);
}

function createNew() {
  const s = {
    id: uid(), title: '', updatedAt: new Date().toISOString(),
    events: [],
    members: memberMaster.map(m => ({ id: uid(), name: m.name })),
    cells: {}
  };
  scheduleList.unshift(s);
  saveList();
  current  = s;
  isShared = false;
  history.replaceState(null, '', location.pathname + '#id=' + s.id);
  showView('schedule');
}

function newSchedule() { navigate('#new'); }

function deleteSchedule(e, id) {
  e.stopPropagation();
  if (!confirm('このスケジュールを削除しますか？')) return;
  scheduleList = scheduleList.filter(s => s.id !== id);
  saveList();
  renderHome();
}

/* ── SCHEDULE ── */
function renderSchedule() {
  updateThemeBtns();

  // Title
  const titleEl = document.getElementById('sched-title');
  if (titleEl && document.activeElement !== titleEl) titleEl.value = current.title || '';

  // Shared banner
  const banner = document.getElementById('shared-banner');
  banner.classList.toggle('hidden', !isShared);

  renderMatrix();
}

function onTitleChange(val) {
  if (!current) return;
  current.title = val;
  if (!isShared) saveCurrentToList();
}

function saveSharedSchedule() {
  if (!current) return;
  const existing = scheduleList.find(s => s.id === current.id);
  if (!existing) {
    scheduleList.unshift({ ...current, updatedAt: new Date().toISOString() });
    saveList();
  }
  isShared = false;
  history.replaceState(null, '', location.pathname + '#id=' + current.id);
  document.getElementById('shared-banner').classList.add('hidden');
  showToast('スケジュールを保存しました');
}

/* ── DATE SORT HELPERS ── */
function parseEventDate(title) {
  const m = title.match(/^(\d{1,2})\/(\d{1,2})/);
  if (!m) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const y = today.getFullYear();
  const d = new Date(y, parseInt(m[1]) - 1, parseInt(m[2]));
  if (today - d > 180 * 86400000) d.setFullYear(y + 1);
  return d;
}

function getSortedEvents() {
  const today = new Date(); today.setHours(0,0,0,0);
  return [...current.events].sort((a, b) => {
    const da = parseEventDate(a.title), db = parseEventDate(b.title);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da - db;
  });
}

let _lastRenderedScheduleId = null;

function autoScrollToUpcoming() {
  const wrap = document.querySelector('.table-scroll');
  if (!wrap) return;
  const upcoming = wrap.querySelector('.th-event.next-upcoming');
  if (!upcoming) {
    const allPast = wrap.querySelectorAll('.th-event.past');
    if (allPast.length) wrap.scrollLeft = wrap.scrollWidth;
    return;
  }
  const stickyWidth = (wrap.querySelector('.th-name') || {offsetWidth: 80}).offsetWidth;
  wrap.scrollLeft = Math.max(0, upcoming.offsetLeft - stickyWidth);
}

/* ── MATRIX ── */
function getStatus(mid, eid) { return current.cells?.[mid]?.[eid] ?? 0; }
function setStatus(mid, eid, s) {
  if (!current.cells) current.cells = {};
  if (!current.cells[mid]) current.cells[mid] = {};
  current.cells[mid][eid] = s;
}

function toggleStatus(mid, eid) {
  setStatus(mid, eid, STATUS_NEXT[getStatus(mid, eid)]);
  if (!isShared) saveCurrentToList(); else renderMatrix();
  renderMatrix();
}

function renderMatrix() {
  const cont = document.getElementById('matrix-container');
  const { members } = current;
  const sorted = getSortedEvents();

  if (!members.length && !sorted.length) {
    cont.innerHTML = `<div class="mx-empty"><strong>データがまだありません</strong><p>下のフォームから参加者と日程を追加してください</p></div>`;
    return;
  }

  const today = new Date(); today.setHours(0,0,0,0);
  // Classify each event
  const evMeta = sorted.map(ev => {
    const d = parseEventDate(ev.title);
    return { ev, d, isPast: d ? d < today : false };
  });
  // Find first upcoming index
  const firstUpcomingIdx = evMeta.findIndex(m => !m.isPast);

  // Preserve scroll unless schedule changed
  const scheduleChanged = _lastRenderedScheduleId !== current.id;
  _lastRenderedScheduleId = current.id;
  const wrap = document.querySelector('.table-scroll');
  const savedScroll = (!scheduleChanged && wrap) ? wrap.scrollLeft : null;

  let h = '<table class="matrix"><thead><tr>';
  h += `<th class="th-name">参加者</th>`;
  evMeta.forEach(({ ev, isPast }, idx) => {
    const cls = isPast ? ' past' : (idx === firstUpcomingIdx ? ' next-upcoming' : '');
    const badge = idx === firstUpcomingIdx ? `<span class="upcoming-badge">NEXT</span><br>` : '';
    h += `<th class="th-event${cls}">
      <div class="event-header">
        <div style="flex:1;min-width:0">
          ${badge}<span class="event-name" ondblclick="editEventName('${ev.id}',this)" title="ダブルタップで編集">${esc(ev.title)}</span>
        </div>
        <button class="ev-del" onclick="deleteEvent('${ev.id}')" title="削除">✕</button>
      </div></th>`;
  });
  h += `<th class="th-addcol"><button class="btn-addcol" onclick="focusInput('add-event')" title="日程を追加">＋</button></th>`;
  h += '</tr></thead><tbody>';

  members.forEach((m, i) => {
    h += `<tr><td class="td-name"><div class="name-cell">
      <span class="member-name" ondblclick="editMemberName('${m.id}',this)" title="ダブルタップで編集">${esc(m.name)}</span>
      <div class="row-acts">
        <button class="rbtn" onclick="moveMember('${m.id}',-1)" title="上へ"
          ${i===0?'style="visibility:hidden"':''}>↑</button>
        <button class="rbtn" onclick="moveMember('${m.id}',1)" title="下へ"
          ${i===members.length-1?'style="visibility:hidden"':''}>↓</button>
        <button class="rbtn del" onclick="deleteMember('${m.id}')" title="削除">✕</button>
      </div>
    </div></td>`;
    evMeta.forEach(({ ev, isPast }) => {
      const s = getStatus(m.id, ev.id);
      const pastCls = isPast ? ' past' : '';
      h += `<td class="td-cell s${s}${pastCls}" onclick="toggleStatus('${m.id}','${ev.id}')">
        <div class="ci"><span class="si">${STATUS[s]}</span></div></td>`;
    });
    h += '<td class="td-spacer"></td></tr>';
  });

  if (members.length > 0 && sorted.length > 0) {
    h += `<tr class="sum-row"><td class="td-name sum-label">集計</td>`;
    evMeta.forEach(({ ev, isPast }) => {
      const c = [0,0,0,0];
      members.forEach(m => c[getStatus(m.id,ev.id)]++);
      const pastCls = isPast ? ' past' : '';
      h += `<td class="td-cell s0${pastCls}"><div class="sum-counts">
        <span class="chip c">○ ${c[1]}</span>
        <span class="chip t">△ ${c[2]}</span>
        <span class="chip x">× ${c[3]}</span>
      </div></td>`;
    });
    h += '<td class="td-spacer"></td></tr>';
  }

  h += '</tbody></table>';
  cont.innerHTML = h;

  // Restore or auto-scroll
  requestAnimationFrame(() => {
    const w = document.querySelector('.table-scroll');
    if (!w) return;
    if (savedScroll !== null) {
      w.scrollLeft = savedScroll;
    } else {
      autoScrollToUpcoming();
    }
  });
}

/* ── MUTATIONS ── */
function addMemberFromInput() {
  const el = document.getElementById('add-member');
  const name = el.value.trim();
  if (!name) { el.focus(); return; }
  current.members.push({ id: uid(), name });
  if (!isShared) saveCurrentToList();
  renderMatrix();
  el.value = ''; el.focus();
}

function addEventFromInput() {
  const el = document.getElementById('add-event');
  const title = el.value.trim();
  if (!title) { el.focus(); return; }
  current.events.push({ id: uid(), title });
  if (!isShared) saveCurrentToList();
  renderMatrix();
  el.value = ''; el.focus();
  setTimeout(() => {
    const w = document.querySelector('.table-scroll');
    if (w) w.scrollLeft = w.scrollWidth;
  }, 0);
}

function deleteMember(id) {
  current.members = current.members.filter(m => m.id !== id);
  if (current.cells) delete current.cells[id];
  if (!isShared) saveCurrentToList();
  renderMatrix();
}

function deleteEvent(id) {
  current.events = current.events.filter(e => e.id !== id);
  if (current.cells) Object.values(current.cells).forEach(c => delete c[id]);
  if (!isShared) saveCurrentToList();
  renderMatrix();
}

function moveMember(id, dir) {
  const i = current.members.findIndex(m => m.id === id);
  const j = i + dir;
  if (j < 0 || j >= current.members.length) return;
  [current.members[i], current.members[j]] = [current.members[j], current.members[i]];
  if (!isShared) saveCurrentToList();
  renderMatrix();
}

/* ── INLINE EDIT ── */
function editEventName(id, el) {
  const ev = current.events.find(e => e.id === id);
  if (!ev) return;
  const inp = document.createElement('input');
  inp.className = 'ied-ev'; inp.value = ev.title;
  el.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const save = () => {
    if (done) return; done = true;
    const v = inp.value.trim(); if (v) ev.title = v;
    if (!isShared) saveCurrentToList();
    renderMatrix();
  };
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { done = true; renderMatrix(); }
  });
}

function editMemberName(id, el) {
  const m = current.members.find(m => m.id === id);
  if (!m) return;
  const inp = document.createElement('input');
  inp.className = 'ied-name'; inp.value = m.name;
  el.replaceWith(inp); inp.focus(); inp.select();
  let done = false;
  const save = () => {
    if (done) return; done = true;
    const v = inp.value.trim(); if (v) m.name = v;
    if (!isShared) saveCurrentToList();
    renderMatrix();
  };
  inp.addEventListener('blur', save);
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); save(); }
    if (e.key === 'Escape') { done = true; renderMatrix(); }
  });
}

function focusInput(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  setTimeout(() => el.focus(), 200);
}

/* ================================================================
   SHARE SHEET
================================================================ */
function generateShareUrl() {
  const encoded = btoa(encodeURIComponent(JSON.stringify(current)));
  return location.origin + location.pathname + '#data=' + encoded;
}

function openShareSheet() {
  const url = generateShareUrl();
  document.getElementById('line-share-link').href =
    'https://social-plugins.line.me/lineit/share?url=' + encodeURIComponent(url);
  document.getElementById('sheet-overlay').classList.add('open');
  document.getElementById('share-sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeShareSheet() {
  document.getElementById('sheet-overlay').classList.remove('open');
  document.getElementById('share-sheet').classList.remove('open');
  document.body.style.overflow = '';
}

function copyShareUrl() {
  const url = generateShareUrl();
  const copy = () => {
    const ta = document.createElement('textarea');
    ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('共有リンクをコピーしました！'); }
    catch { prompt('URLをコピーしてください:', url); }
    document.body.removeChild(ta);
  };
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(url).then(() => showToast('共有リンクをコピーしました！')).catch(copy);
  } else { copy(); }
}

/* ================================================================
   JSON I/O
================================================================ */
function exportJson() {
  const json = JSON.stringify(current, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = (current.title || 'schedule') + '_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('JSONファイルを出力しました');
}

function importJson(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const d = JSON.parse(evt.target.result);
      if (!Array.isArray(d.members) || !Array.isArray(d.events)) throw new Error();
      current = { ...d, id: current?.id || uid() };
      if (!current.cells) current.cells = {};
      if (!isShared) saveCurrentToList();
      renderSchedule();
      showToast('データを読み込みました');
    } catch { showToast('ファイルの形式が正しくありません'); }
    e.target.value = '';
  };
  reader.readAsText(file);
  closeShareSheet();
}

/* ================================================================
   THEME
================================================================ */
function toggleTheme() {
  const cur  = document.documentElement.getAttribute('data-theme') || 'system';
  const next = cur === 'system' ? 'dark' : cur === 'dark' ? 'light' : 'system';
  if (next === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme_pref', next); } catch(e) {}
  updateThemeBtns();
}

function updateThemeBtns() {
  const t = document.documentElement.getAttribute('data-theme') || 'system';
  const icon  = t === 'dark' ? '☀' : t === 'light' ? '◑' : '◐';
  const title = t === 'dark' ? 'ライトモードへ' : t === 'light' ? 'システム設定へ' : 'ダークモードへ';
  ['theme-btn-home','theme-btn-sched'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) { btn.textContent = icon; btn.title = title; }
  });
}

/* ================================================================
   TOAST
================================================================ */
let _toastT;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.classList.remove('show'), 2600);
}

/* ================================================================
   INIT
================================================================ */
function init() {
  loadList();
  loadMasterMembers();
  updateThemeBtns();
  route();
}

init();
</script>
